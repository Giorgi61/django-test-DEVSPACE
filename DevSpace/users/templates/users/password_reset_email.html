<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Password Reset</title>
</head>
<body>

<h1>Password Reset: {{ domain }}</h1>

<p><strong>Warning: If you haven't requested password resetting: Ignore the message. </strong></p>

<p> <a href='{{ protocol }}://{{ domain }}{% url 'users:password_reset_confirm' uidb64=uid token=token %}'>reset  </a></p>



</body>
</html>
